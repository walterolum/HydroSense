version: "3.8"

# ═══════════════════════════════════════════════════════════════════════════
# HYDROSENSE — Docker Compose (PostgreSQL + Services)
# ═══════════════════════════════════════════════════════════════════════════
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose run --rm migrate         # Run SQLite → PG migration
#   docker compose down -v                  # Stop and remove volumes
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hydrosense-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hydrosense
      POSTGRES_USER: hydrosense
      POSTGRES_PASSWORD: ${PG_PASSWORD:-hydrosense}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/pg-init.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrosense -d hydrosense"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── Backend Server ──────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: hydrosense-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: hydrosense
      PG_USER: hydrosense
      PG_PASSWORD: ${PG_PASSWORD:-hydrosense}
      PG_POOL_MAX: 20
      AI_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-uma_water_monitor_secret_2025}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-walter.olum@hydrosense.ug}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-walter123}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - server-logs:/app/server/logs

  # ── AI Service ──────────────────────────────────────────────────────────
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: hydrosense-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: hydrosense
      PG_USER: hydrosense
      PG_PASSWORD: ${PG_PASSWORD:-hydrosense}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  server-logs:
    driver: local
