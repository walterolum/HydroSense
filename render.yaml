services:
  - type: web
    name: hydrosense-server
    env: node
    plan: starter
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: 5000
      - key: PG_HOST
        value: localhost
      - key: PG_PORT
        value: 5432
      - key: PG_DATABASE
        value: hydrosense
      - key: PG_USER
        value: hydrosense
      - key: PG_PASSWORD
        sync: false
      - key: PG_POOL_MAX
        value: 20
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: hydrosense-db
    databaseName: hydrosense
    user: hydrosense
    plan: starter
    version: "16"
